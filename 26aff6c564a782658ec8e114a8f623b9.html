function petPhotoCooldownKey(pi){return "groom_pet_photo_cd_"+PORTAL_ID+"_"+pi;}
function petPhotoCooldownRemaining(pi){var until=parseInt(localStorage.getItem(petPhotoCooldownKey(pi))||"0",10);var rem=until-Date.now();return rem>0?rem:0;}
function formatCooldownRemaining(ms){var mins=Math.ceil(ms/60000);if(mins<=1)return"a minute";if(mins<60)return mins+" minutes";var hrs=Math.floor(mins/60);var rem=mins%60;return hrs+(hrs===1?" hour":" hours")+(rem?" "+rem+" min":"");}
function b64u(s){var b=atob(s);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
var VAX_BADGE_LABELS = { current:'Current', missing:'Missing', pending_review:'Pending Review', expiring_soon:'Expiring Soon', expired:'Expired' };
var VAX_BADGE_COLORS = { current:'#4a9d6e', missing:'#c0392b', pending_review:'#888', expiring_soon:'#c9820a', expired:'#c0392b' };
// Lower number = more severe. Expired and Missing are treated as equally
// bad on purpose - a lapsed vaccine and no vaccine at all pose the same
// practical risk, neither is meaningfully worse than the other.
var VAX_BADGE_SEVERITY = { expired:0, missing:0, pending_review:1, expiring_soon:2, current:3 };

function daysUntil(dateStr){
  if (!dateStr) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

// Determines one vaccine TYPE's overall status from every record on file
// for it - not just the most recently added one. A newer pending
// resubmission correctly outranks an older expired-but-approved record,
// since checking for any currently-valid approved record happens first.
function computeVaxTypeStatus(recordsOfType, thresholdDays){
  if (!recordsOfType.length) return 'missing';
  var validApproved = recordsOfType.filter(function(r){
    return r.reviewStatus === 'approved' && (!r.expirationDate || daysUntil(r.expirationDate) >= 0);
  }).sort(function(a,b){
    if (!a.expirationDate) return -1;
    if (!b.expirationDate) return 1;
    return daysUntil(b.expirationDate) - daysUntil(a.expirationDate);
  });
  if (validApproved.length) {
    var days = daysUntil(validApproved[0].expirationDate);
    if (days === null) return 'current';
    return days <= thresholdDays ? 'expiring_soon' : 'current';
  }
  var pending = recordsOfType.filter(function(r){ return r.reviewStatus === 'pending' || r.reviewStatus === 'needs_clarification'; });
  if (pending.length) return 'pending_review';
  var hasExpiredApproved = recordsOfType.some(function(r){ return r.reviewStatus === 'approved' && r.expirationDate && daysUntil(r.expirationDate) < 0; });
  if (hasExpiredApproved) return 'expired';
  return 'missing'; // only rejected records exist, or nothing usable at all
}

// The pet-level badge is the worst status among every REQUIRED vaccine
// type only - an optional type (currently DHPP, Leptospirosis) with
// nothing submitted for it is left out of this entirely, not counted as
// Missing, since it was never required in the first place.
function computePetVaxBadge(records){
  var statuses = VAX_REQUIRED_TYPES.map(function(type){
    return computeVaxTypeStatus(records.filter(function(r){ return r.vaccineType === type; }), VAX_EXPIRING_THRESHOLD_DAYS);
  });
  if (!statuses.length) return 'current';
  statuses.sort(function(a,b){ return VAX_BADGE_SEVERITY[a] - VAX_BADGE_SEVERITY[b]; });
  return statuses[0];
}

function renderVaxBadgeHTML(records){
  var status = computePetVaxBadge(records || []);
  return '<span style="font-size:0.72rem;font-weight:700;padding:0.15rem 0.55rem;border-radius:10px;background:'+VAX_BADGE_COLORS[status]+';color:#fff;">'+VAX_BADGE_LABELS[status]+'</span>';
}

var VAX_TYPE_LABELS_CLIENT = { rabies:'Rabies', bordetella:'Bordetella', dhpp:'DHPP', leptospirosis:'Leptospirosis' };
var VAX_STATUS_LABELS_CLIENT = { pending:'Pending Review', approved:'Approved', needs_clarification:'Needs Clarification', rejected:'Rejected' };
var VAX_STATUS_COLORS_CLIENT = { pending:'#888', approved:'#4a9d6e', needs_clarification:'#c9820a', rejected:'#c0392b' };
function renderVaxRecordsHTML(records){
  records = records || [];
  var seenTypes = {};
  var rows = records.map(function(v){
    seenTypes[v.vaccineType] = true;
    var typeLabel = v.vaccineType === 'other' ? (v.vaccineTypeOther || 'Other') : (VAX_TYPE_LABELS_CLIENT[v.vaccineType] || v.vaccineType);
    var statusLabel = VAX_STATUS_LABELS_CLIENT[v.reviewStatus] || v.reviewStatus || 'Pending Review';
    var statusColor = VAX_STATUS_COLORS_CLIENT[v.reviewStatus] || '#888';
    var dates = [v.dateAdministered ? 'Given '+v.dateAdministered : '', v.expirationDate ? 'Expires '+v.expirationDate : ''].filter(Boolean).join(' · ');
    return '<div style="padding:0.4rem 0;border-bottom:1px solid #eee;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;"><strong>'+typeLabel+'</strong><span style="font-size:0.75rem;font-weight:600;color:'+statusColor+';">'+statusLabel+'</span></div>'
      + (dates ? '<div style="font-size:0.8rem;color:#666;">'+dates+'</div>' : '')
      + '</div>';
  });
  // A required type with zero records anywhere is exactly what drives the
  // pet-level badge to Missing, but until now that stayed invisible here -
  // nothing in this list ever explained it, since the list only ever
  // showed records that actually exist. Called out explicitly now, so
  // "Missing" on the badge always has a visible reason right below it.
  VAX_REQUIRED_TYPES.forEach(function(type){
    if (seenTypes[type]) return;
    var label = VAX_TYPE_LABELS_CLIENT[type] || type;
    rows.push('<div style="padding:0.4rem 0;border-bottom:1px solid #eee;"><div style="display:flex;justify-content:space-between;align-items:center;"><strong>'+label+'</strong><span style="font-size:0.75rem;font-weight:600;color:'+VAX_BADGE_COLORS.missing+';">Missing — nothing submitted yet</span></div></div>');
  });
  return rows.length ? rows.join('') : '<div style="color:#999;">None on file</div>';
}

    + '<div id="medlog-box-'+pi+'" style="display:none;margin-top:0.6rem;padding:0.75rem;background:var(--stone);border-radius:8px;">'
      + '<div style="margin-bottom:0.4rem;"><label style="font-size:0.75rem;display:block;">Type</label><select id="medlog-type-'+pi+'" style="width:100%;padding:0.3rem;"><option value="allergy">Allergy</option><option value="medication">Medication</option></select></div>'

      + '<div style="margin-bottom:0.4rem;"><label style="font-size:0.75rem;display:block;">Notes <span style="color:#999;">(optional)</span></label><input type="text" id="medlog-notes-'+pi+'" style="width:100%;padding:0.3rem;box-sizing:border-box;"/></div>'

      + '<button type="button" onclick="submitMedicalLogEntry('+pi+')" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:0.4rem 1rem;font-size:0.8rem;cursor:pointer;">Add</button>'

function renderPortalData(data){
  var pets = data.pets||[];
  var petHTML = pets.length ? pets.map(function(p,pi){
    var cdRem = petPhotoCooldownRemaining(pi);
    var vax = renderVaxRecordsHTML(p.vaccinationRecords);
    var hist = (p.groomingHistory||[]).slice().reverse().map(function(h){ return '<div style="padding:0.4rem 0;border-bottom:1px solid #eee;"><strong>'+(h.date||'')+'</strong> - '+(h.service||'')+(h.notes?'<div style="font-size:0.85rem;color:#666;">'+h.notes+'</div>':'')+'</div>'; }).join('') || '<div style="color:#999;">No visits on file yet</div>';
    var photoBlock = p.photo
      ? '<img src="'+p.photo+'" style="width:52px;height:52px;border-radius:50%;object-fit:cover;"/>'
      : (PET_PHOTO_WORKER_URL ? (cdRem
          ? '<div style="width:52px;height:52px;border-radius:50%;background:#f3f4f6;border:1.5px dashed #999;display:flex;align-items:center;justify-content:center;flex-shrink:0;" title="You can add a photo of '+p.name+' again in '+formatCooldownRemaining(cdRem)+'"><svg width="18" height="18" fill="none" stroke="#999" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>'
          : '<label style="width:52px;height:52px;border-radius:50%;background:var(--primary-light);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" title="Add a photo of '+p.name+'"><svg width="20" height="20" fill="none" stroke="var(--primary)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input type="file" accept="image/*" style="display:none;" onchange="submitPetPhoto('+pi+',this)"/></label>')
        : '');
    var statusBlock = (!p.photo && PET_PHOTO_WORKER_URL)
      ? '<div id="pet-photo-status-'+pi+'" style="font-size:0.78rem;margin:0 0 0.75rem;color:#666;display:'+(cdRem?"block":"none")+';">'+(cdRem?("You can add another photo in "+formatCooldownRemaining(cdRem)+"."):"")+'</div>'
      : '';
    var flagsHTML = (p.flags && p.flags.length) ? '<div style="margin-bottom:0.5rem;display:flex;flex-wrap:wrap;gap:0.3rem;">' + p.flags.map(function(f){ return '<span style="display:inline-block;background:#fff3cd;color:#92400e;border-radius:10px;padding:0.15rem 0.6rem;font-size:0.72rem;font-weight:600;">'+f+'</span>'; }).join('') + '</div>' : '';
    var bookLinks = [];
    if (data.businessPhone) bookLinks.push('<a href="tel:'+data.businessPhone.replace(/[^0-9+]/g,'')+'" style="display:inline-block;background:var(--primary);color:#fff;text-decoration:none;border-radius:6px;padding:0.4rem 0.9rem;font-size:0.8rem;font-weight:600;">&#128222; Call to Book</a>');
    if (data.businessEmail) bookLinks.push('<a href="mailto:'+data.businessEmail+'?subject='+encodeURIComponent('Appointment Request for '+p.name)+'" style="display:inline-block;background:none;color:var(--primary);border:1px solid var(--primary);text-decoration:none;border-radius:6px;padding:0.4rem 0.9rem;font-size:0.8rem;font-weight:600;">&#9993; Email to Book</a>');
    var bookButtonHTML = bookLinks.length ? '<div style="margin-bottom:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap;">' + bookLinks.join('') + '</div>' : '';
    return '<div class="pet-card">' +
      '<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;">' +
      photoBlock +
      '<div><div style="font-family:Georgia,serif;font-size:1.1rem;font-weight:600;color:var(--primary);">'+p.name+'</div>' +
      '<div style="font-size:0.8rem;color:#666;">'+[p.breed,p.coatType,p.size].filter(Boolean).join(' \u00b7 ')+'</div></div></div>' +
      statusBlock +
      flagsHTML +
      bookButtonHTML +
      (p.temperament ? '<div style="margin-bottom:0.75rem;font-size:0.85rem;"><strong>Notes:</strong> '+p.temperament+'</div>' : '') +
      (p.lastGroomDate ? '<div style="margin-bottom:0.75rem;font-size:0.85rem;"><strong>Last Groom:</strong> '+p.lastGroomDate+'</div>' : '') +
      (p.nextApptDate ? '<div style="margin-bottom:0.75rem;font-size:0.85rem;background:var(--primary-light);border-radius:6px;padding:0.5rem 0.75rem;"><strong>Upcoming Appointment:</strong> '+p.nextApptDate+(p.nextApptReason?' - '+p.nextApptReason:'')+'</div>' : '') +
      '<div style="margin-bottom:0.75rem;"><strong style="font-size:0.85rem;">Vaccinations</strong> '+renderVaxBadgeHTML(p.vaccinationRecords)+vax+renderVaxSubmitFormHTML(pi,p.name)+'</div>' +

      renderMedicalLogAreaHTML(pi, p.medicalLog) +
      '<div><strong style="font-size:0.85rem;">Grooming History</strong>'+hist+'</div>' +
      '</div>';
  }).join('') : buildEmptyPetsHTML();
  return '<h1 style="font-size:1.4rem;color:var(--primary);font-family:Georgia,serif;">Welcome, '+data.name+'</h1>' + petHTML;
}

// fallback if it's missing or 404s - deliberately more than a flat "no

    ? '<img src="'+PLACEHOLDER_IMAGE_PATH+'" alt="" style="max-width:200px;width:100%;border-radius:12px;margin:0 auto 1rem;display:block;" onerror="this.style.display=\'none\';document.getElementById(\'empty-state-fallback\').style.display=\'block\';"/>'

    + img
    + '<div id="empty-state-fallback" style="display:'+fallbackDisplay+';font-size:3rem;margin-bottom:0.5rem;">&#128062;</div>'
    + '<p style="color:#888;margin:0;">Nothing to groom here yet — check back once your groomer adds your pet\'s info.</p>'
    + '</div>';

async function submitPetPhoto(pi,inputEl){
  var statusEl = document.getElementById('pet-photo-status-'+pi);
  if (!PET_PHOTO_WORKER_URL) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Photo uploads are not available yet \u2014 please contact us directly.';} return; }
  var cdRem = petPhotoCooldownRemaining(pi);
  if (cdRem > 0) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#666';statusEl.textContent='You can add another photo in '+formatCooldownRemaining(cdRem)+'.';} return; }
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Uploading\u2026'; }
  try {
    var dataUrl = await new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('Could not read the selected photo.')); };
      reader.readAsDataURL(file);
    });
    var commaIdx = dataUrl.indexOf(',');
    var payload = { action:'submit_pet_photo', portalId:PORTAL_ID, petIndex:pi, photo:dataUrl.slice(commaIdx+1), photoType:file.type };
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) {
      inputEl.disabled = true;
      localStorage.setItem(petPhotoCooldownKey(pi), String(Date.now()+PET_PHOTO_COOLDOWN_MS));
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Thanks! Your photo was sent and will show here once approved.'; }
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong. Please try again.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong. Please try again.'; }
  }
}
function toggleVaxSubmitForm(pi){
  var box = document.getElementById('vax-submit-box-'+pi);
  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}
function toggleVaxSubmitOther(pi, val){
  var w = document.getElementById('vax-submit-other-wrap-'+pi);

}
async function submitVaccinationRecord(pi){
  var statusEl = document.getElementById('vax-submit-status-'+pi);
  if (!PET_PHOTO_WORKER_URL) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Submissions are not available yet \u2014 please contact us directly.';} return; }
  var typeEl = document.getElementById('vax-submit-type-'+pi);
  var otherEl = document.getElementById('vax-submit-other-'+pi);
  var dateAdminEl = document.getElementById('vax-submit-dateadmin-'+pi);
  var expiryEl = document.getElementById('vax-submit-expiry-'+pi);
  var notesEl = document.getElementById('vax-submit-notes-'+pi);
  var fileEl = document.getElementById('vax-submit-file-'+pi);
  var certEl = document.getElementById('vax-submit-cert-'+pi);
  var file = fileEl.files && fileEl.files[0];
  if (!file) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Please attach a photo, scan, or PDF.';} return; }
  if (!certEl.checked) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Please check the certification box before submitting.';} return; }
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Uploading\u2026'; }
  try {
    var dataUrl = await new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('Could not read the selected file.')); };
      reader.readAsDataURL(file);
    });
    var commaIdx = dataUrl.indexOf(',');
    var payload = {
      action:'submit_vaccination_record', portalId:PORTAL_ID, petIndex:pi,
      vaccineType: typeEl.value, vaccineTypeOther: otherEl.value,
      dateAdministered: dateAdminEl.value, expirationDate: expiryEl.value,
      notes: notesEl.value, certified: true,
      document: dataUrl.slice(commaIdx+1), documentType: file.type
    };
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) {
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Thanks! Your document was sent and will show here once reviewed.'; }
      typeEl.value = 'rabies'; otherEl.value=''; dateAdminEl.value=''; expiryEl.value=''; notesEl.value=''; fileEl.value=''; certEl.checked=false;
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong. Please try again.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong. Please try again.'; }
  }
}

function toggleMedicalLogForm(pi){

  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';

async function submitMedicalLogEntry(pi){
  var statusEl = document.getElementById('medlog-status-'+pi);
  if (!PET_PHOTO_WORKER_URL) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Updates are not available yet \u2014 please contact us directly.';} return; }
  var typeEl = document.getElementById('medlog-type-'+pi);
  var nameEl = document.getElementById('medlog-name-'+pi);
  var notesEl = document.getElementById('medlog-notes-'+pi);
  var ackEl = document.getElementById('medlog-ack-'+pi);
  if (!nameEl.value.trim()) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Please enter a name.';} return; }
  if (!ackEl.checked) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Please check the acknowledgment box before submitting.';} return; }
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Saving\u2026'; }
  try {
    var payload = { action:'add_medical_log_entry', portalId:PORTAL_ID, petIndex:pi, type: typeEl.value, name: nameEl.value, notes: notesEl.value, acknowledged: true };
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) {
      var data = await res.json().catch(function(){ return {}; });
      if (data.entry) {
        var listEl = document.getElementById('medlog-list-'+pi);
        if (listEl) {
          var emptyMsg = listEl.querySelector('.medlog-empty');
          if (emptyMsg) emptyMsg.remove();
          listEl.insertAdjacentHTML('beforeend', renderMedicalLogEntryHTML(pi, data.entry));
        }
      }
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Added.'; }
      nameEl.value=''; notesEl.value=''; ackEl.checked=false;
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong. Please try again.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong. Please try again.'; }
  }
}
async function removeMedicalLogEntry(pi, entryId){
  if (!PET_PHOTO_WORKER_URL) return;
  if (!confirm('Remove this entry?')) return;
  try {
    var payload = { action:'remove_medical_log_entry', portalId:PORTAL_ID, petIndex:pi, entryId: entryId };
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) {
      var row = document.getElementById('medlog-entry-'+entryId);
      if (row) row.remove();
      var listEl = document.getElementById('medlog-list-'+pi);
      if (listEl && !listEl.querySelector('[id^="medlog-entry-"]')) {
        listEl.innerHTML = '<div class="medlog-empty" style="color:#999;font-size:0.85rem;">None on file yet.</div>';
      }
    }
  } catch(e) {}
}
async function portalCheckPassword(){
  var pass = document.getElementById('portal-password').value;
  var errEl = document.getElementById('portal-login-error');
  errEl.style.display = 'none';
  if (!pass) return;
  try {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), {name:'PBKDF2'}, false, ['deriveKey']);
    var kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64u(WRAP_SALT), iterations:PBKDF2_ITERATIONS, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var dkBytes = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(WRAP_IV)}, kek, b64u(WRAP_CT));
    var dkKey = await crypto.subtle.importKey('raw', dkBytes, {name:'AES-GCM'}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(PAY_IV)}, dkKey, b64u(PAY_CT));
    var data = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('portal-mount').innerHTML = renderPortalData(data);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('portal-mount').style.display = 'block';
  } catch(e) {
    errEl.style.display = 'block';
    document.getElementById('portal-password').value = '';
  }
}
document.getElementById('portal-password').addEventListener('keydown', function(e){ if (e.key === 'Enter') portalCheckPassword(); });
