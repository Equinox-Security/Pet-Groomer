function petPhotoCooldownRemaining(pi){var until=parseInt(localStorage.getItem(petPhotoCooldownKey(pi))||"0",10);var rem=until-Date.now();return rem>0?rem:0;}
function formatCooldownRemaining(ms){var mins=Math.ceil(ms/60000);if(mins<=1)return"a minute";if(mins<60)return mins+" minutes";var hrs=Math.floor(mins/60);var rem=mins%60;return hrs+(hrs===1?" hour":" hours")+(rem?" "+rem+" min":"");}

var VAX_BADGE_LABELS = { current:'Current', missing:'Missing', pending_review:'Pending Review', expiring_soon:'Expiring Soon', expired:'Expired' };
var VAX_BADGE_COLORS = { current:'#4a9d6e', missing:'#c0392b', pending_review:'#888', expiring_soon:'#c9820a', expired:'#c0392b' };
// Lower number = more severe. Expired and Missing are treated as equally
// bad on purpose - a lapsed vaccine and no vaccine at all pose the same
// practical risk, neither is meaningfully worse than the other.
var VAX_BADGE_SEVERITY = { expired:0, missing:0, pending_review:1, expiring_soon:2, current:3 };

function daysUntil(dateStr){
  if (!dateStr) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

// Determines one vaccine TYPE's overall status from every record on file
// for it - not just the most recently added one. A newer pending
// resubmission correctly outranks an older expired-but-approved record,
// since checking for any currently-valid approved record happens first.
function computeVaxTypeStatus(recordsOfType, thresholdDays){
  if (!recordsOfType.length) return 'missing';
  var validApproved = recordsOfType.filter(function(r){
    return r.reviewStatus === 'approved' && (!r.expirationDate || daysUntil(r.expirationDate) >= 0);
  }).sort(function(a,b){
    if (!a.expirationDate) return -1;
    if (!b.expirationDate) return 1;
    return daysUntil(b.expirationDate) - daysUntil(a.expirationDate);
  });
  if (validApproved.length) {
    var days = daysUntil(validApproved[0].expirationDate);
    if (days === null) return 'current';
    return days <= thresholdDays ? 'expiring_soon' : 'current';
  }
  var pending = recordsOfType.filter(function(r){ return r.reviewStatus === 'pending' || r.reviewStatus === 'needs_clarification'; });
  if (pending.length) return 'pending_review';
  var hasExpiredApproved = recordsOfType.some(function(r){ return r.reviewStatus === 'approved' && r.expirationDate && daysUntil(r.expirationDate) < 0; });
  if (hasExpiredApproved) return 'expired';
  return 'missing'; // only rejected records exist, or nothing usable at all
}

// The pet-level badge is the worst status among every REQUIRED vaccine
// type only - an optional type (currently DHPP, Leptospirosis) with
// nothing submitted for it is left out of this entirely, not counted as
// Missing, since it was never required in the first place.
function computePetVaxBadge(records){
  var statuses = VAX_REQUIRED_TYPES.map(function(type){
    return computeVaxTypeStatus(records.filter(function(r){ return r.vaccineType === type; }), VAX_EXPIRING_THRESHOLD_DAYS);
  });
  if (!statuses.length) return 'current';
  statuses.sort(function(a,b){ return VAX_BADGE_SEVERITY[a] - VAX_BADGE_SEVERITY[b]; });
  return statuses[0];
}

function renderVaxBadgeHTML(records){
  var status = computePetVaxBadge(records || []);
  return '<span style="font-size:0.72rem;font-weight:700;padding:0.15rem 0.55rem;border-radius:10px;background:'+VAX_BADGE_COLORS[status]+';color:#fff;">'+VAX_BADGE_LABELS[status]+'</span>';
}

var VAX_TYPE_LABELS_CLIENT = { rabies:'Rabies', bordetella:'Bordetella', dhpp:'DHPP', leptospirosis:'Leptospirosis' };
var VAX_STATUS_LABELS_CLIENT = { pending:'Pending Review', approved:'Approved', needs_clarification:'Needs Clarification', rejected:'Rejected' };
var VAX_STATUS_COLORS_CLIENT = { pending:'#888', approved:'#4a9d6e', needs_clarification:'#c9820a', rejected:'#c0392b' };
function renderVaxRecordsHTML(records){
  records = records || [];
  var seenTypes = {};
  var rows = records.map(function(v){
    seenTypes[v.vaccineType] = true;
    var typeLabel = v.vaccineType === 'other' ? (v.vaccineTypeOther || 'Other') : (VAX_TYPE_LABELS_CLIENT[v.vaccineType] || v.vaccineType);
    var statusLabel = VAX_STATUS_LABELS_CLIENT[v.reviewStatus] || v.reviewStatus || 'Pending Review';
    var statusColor = VAX_STATUS_COLORS_CLIENT[v.reviewStatus] || '#888';
    var dates = [v.dateAdministered ? 'Given '+v.dateAdministered : '', v.expirationDate ? 'Expires '+v.expirationDate : ''].filter(Boolean).join(' · ');
    return '<div style="padding:0.4rem 0;border-bottom:1px solid #eee;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;"><strong>'+typeLabel+'</strong><span style="font-size:0.75rem;font-weight:600;color:'+statusColor+';">'+statusLabel+'</span></div>'
      + (dates ? '<div style="font-size:0.8rem;color:#666;">'+dates+'</div>' : '')
      + '</div>';
  });
  // A required type with zero records anywhere is exactly what drives the
  // pet-level badge to Missing, but until now that stayed invisible here -
  // nothing in this list ever explained it, since the list only ever
  // showed records that actually exist. Called out explicitly now, so
  // "Missing" on the badge always has a visible reason right below it.
  VAX_REQUIRED_TYPES.forEach(function(type){
    if (seenTypes[type]) return;
    var label = VAX_TYPE_LABELS_CLIENT[type] || type;
    rows.push('<div style="padding:0.4rem 0;border-bottom:1px solid #eee;"><div style="display:flex;justify-content:space-between;align-items:center;"><strong>'+label+'</strong><span style="font-size:0.75rem;font-weight:600;color:'+VAX_BADGE_COLORS.missing+';">Missing — nothing submitted yet</span></div></div>');
  });
  return rows.length ? rows.join('') : '<div style="color:#999;">None on file</div>';
}

var _lastMessageCount = null;
async function loadMessages(isManualCheck){
  var listEl = document.getElementById('messages-list');
  var checkStatusEl = document.getElementById('messages-check-status');
  var closeAreaEl = document.getElementById('close-conversation-area');
  var pastAreaEl = document.getElementById('past-conversations-area');
  var bannerEl = document.getElementById('new-reply-banner');
  if (!listEl || !PET_PHOTO_WORKER_URL) return;
  if (isManualCheck && checkStatusEl) { checkStatusEl.style.display='block'; checkStatusEl.style.color='#666'; checkStatusEl.textContent='Checking\u2026'; }
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'get_messages', portalId:PORTAL_ID }) });
    if (res.ok) {
      var data = await res.json();
      var activeMsgs = (data.activeThread && data.activeThread.messages) || [];
      listEl.innerHTML = renderMessagesListHTML(activeMsgs);
      listEl.scrollTop = listEl.scrollHeight;
      if (closeAreaEl) {
        closeAreaEl.innerHTML = activeMsgs.length ? '<button type="button" onclick="closeConversation()" style="background:none;border:1px solid #999;color:var(--text-muted);border-radius:6px;padding:0.3rem 0.7rem;font-size:0.75rem;cursor:pointer;">Close &amp; Archive This Conversation</button>' : '';
      }
      if (pastAreaEl) pastAreaEl.innerHTML = renderPastThreadsHTML(data.pastThreads);
      if (bannerEl) {
        var lastMsg = activeMsgs.length ? activeMsgs[activeMsgs.length - 1] : null;
        bannerEl.innerHTML = (lastMsg && lastMsg.from === 'staff')
          ? '<div class="new-message-alert" style="background:var(--primary-light);border:2px solid var(--primary);border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;"><span style="font-size:0.9rem;font-weight:600;">&#128172; You have a new message from your groomer!</span><button type="button" onclick="scrollToMessages()" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:0.4rem 0.9rem;font-size:0.8rem;cursor:pointer;font-family:inherit;">View Message</button></div>'
          : '';
      }
      if (isManualCheck && checkStatusEl) {
        var newCount = _lastMessageCount === null ? 0 : activeMsgs.length - _lastMessageCount;
        if (newCount > 0) {
          checkStatusEl.style.color = '#4a9d6e';
          checkStatusEl.textContent = newCount + ' new message' + (newCount===1?'':'s') + '.';
        } else {
          checkStatusEl.style.color = '#666';
          checkStatusEl.textContent = 'No new replies yet.';
        }
      }
      _lastMessageCount = activeMsgs.length;
    } else {
      listEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">Could not load messages.</div>';
      if (isManualCheck && checkStatusEl) { checkStatusEl.style.display='block'; checkStatusEl.style.color='#c0392b'; checkStatusEl.textContent='Could not check for replies.'; }
    }
  } catch(e) {
    listEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">Could not load messages.</div>';
    if (isManualCheck && checkStatusEl) { checkStatusEl.style.display='block'; checkStatusEl.style.color='#c0392b'; checkStatusEl.textContent='Could not check for replies.'; }
  }
}
async function sendMessage(){
  var statusEl = document.getElementById('message-status');
  var textEl = document.getElementById('message-compose');
  var text = (textEl.value||'').trim();
  if (!text) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Please enter a message.';} return; }
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Sending\u2026'; }
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'send_client_message', portalId:PORTAL_ID, text:text }) });
    if (res.ok) {
      textEl.value = '';
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Sent.'; }
      await loadMessages();
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong. Please try again.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong. Please try again.'; }
  }
}
async function closeConversation(){
  if (!confirm('Close and archive this conversation? You can still view it later under Past Conversations.')) return;
  var statusEl = document.getElementById('message-status');
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Closing\u2026'; }
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'close_thread', portalId:PORTAL_ID, closedBy:'client' }) });
    if (res.ok) {
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Closed.'; }
      await loadMessages();
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong.'; }
  }
}
async function hideThread(threadId){
  if (!confirm('Remove this conversation from your view? Staff will still be able to see it on their end.')) return;
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'hide_thread', portalId:PORTAL_ID, threadId:threadId }) });
    if (res.ok) await loadMessages();
  } catch(e) {}
}
function formatApptTime12h(hhmm){
  if (!hhmm) return '';
  var parts = hhmm.split(':');
  var h = parseInt(parts[0], 10);
  if (isNaN(h)) return '';
  var m = parts[1] || '00';
  var ampm = h >= 12 ? 'pm' : 'am';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + m + ampm;
}

      (p.temperament ? '<div style="margin-bottom:0.75rem;font-size:0.85rem;"><strong>Notes:</strong> '+p.temperament+'</div>' : '') +
      (p.lastGroomDate ? '<div style="margin-bottom:0.75rem;font-size:0.85rem;"><strong>Last Groom:</strong> '+p.lastGroomDate+'</div>' : '') +
      buildApptBlockHTML(pi, p) +
      '<div style="margin-bottom:0.75rem;"><strong style="font-size:0.85rem;">Vaccinations</strong> '+renderVaxBadgeHTML(p.vaccinationRecords)+vax+renderVaxSubmitFormHTML(pi,p.name)+'</div>' +

      renderMedicalLogAreaHTML(pi, p.medicalLog) +
      '<div><strong style="font-size:0.85rem;">Grooming History</strong>'+hist+'</div>' +

// One pet card visible at a time rather than stacking every pet's full
// data on the page at once - the whole point being the portal was
// getting heavy even with just 2 pets. Messages section always renders
// right after the pet cards in document order, so with only one card
// ever visible, it naturally ends up directly below whichever pet is
// currently open - no separate logic needed to reposition it.
function switchPortalPet(sel){
  var i=0;
  while(true){
    var card=document.getElementById('portal-pet-card-'+i);
    var tab=document.getElementById('portal-pet-tab-'+i);
    if(!card&&!tab)break;
    if(card)card.style.display=(i===sel?'block':'none');
    if(tab){tab.style.background=(i===sel?'var(--primary)':'#fff');tab.style.color=(i===sel?'#fff':'var(--primary)');}
    i++;
  }
}

    : '';

async function submitPetPhoto(pi,inputEl){
  var statusEl = document.getElementById('pet-photo-status-'+pi);
  if (!PET_PHOTO_WORKER_URL) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#c0392b';statusEl.textContent='Photo uploads are not available yet \u2014 please contact us directly.';} return; }
  var cdRem = petPhotoCooldownRemaining(pi);
  if (cdRem > 0) { if(statusEl){statusEl.style.display='block';statusEl.style.color='#666';statusEl.textContent='You can add another photo in '+formatCooldownRemaining(cdRem)+'.';} return; }
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (statusEl) { statusEl.style.display='block'; statusEl.style.color='#666'; statusEl.textContent='Uploading\u2026'; }
  try {
    var dataUrl = await new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('Could not read the selected photo.')); };
      reader.readAsDataURL(file);
    });
    var commaIdx = dataUrl.indexOf(',');
    var payload = { action:'submit_pet_photo', portalId:PORTAL_ID, petIndex:pi, photo:dataUrl.slice(commaIdx+1), photoType:file.type };
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) {
      inputEl.disabled = true;
      localStorage.setItem(petPhotoCooldownKey(pi), String(Date.now()+PET_PHOTO_COOLDOWN_MS));
      if (statusEl) { statusEl.style.color='#4a9d6e'; statusEl.textContent='Thanks! Your photo was sent and will show here once approved.'; }
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent = errText || 'Something went wrong. Please try again.'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.style.color='#c0392b'; statusEl.textContent='Something went wrong. Please try again.'; }
  }
}

var _portalPets = [];
var _myAppointments = [];
async function portalCheckPassword(){
  var pass = document.getElementById('portal-password').value;
  var errEl = document.getElementById('portal-login-error');
  errEl.style.display = 'none';
  if (!pass) return;
  try {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), {name:'PBKDF2'}, false, ['deriveKey']);
    var kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64u(WRAP_SALT), iterations:PBKDF2_ITERATIONS, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var dkBytes = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(WRAP_IV)}, kek, b64u(WRAP_CT));
    var dkKey = await crypto.subtle.importKey('raw', dkBytes, {name:'AES-GCM'}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(PAY_IV)}, dkKey, b64u(PAY_CT));
    var data = JSON.parse(new TextDecoder().decode(plain));
    _portalPets = data.pets || [];
    document.getElementById('portal-mount').innerHTML = renderPortalData(data);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('portal-mount').style.display = 'block';
    loadMessages();
    if (SELF_SERVICE_BOOKING_ENABLED) loadMyAppointments();
  } catch(e) {
    errEl.style.display = 'block';
    document.getElementById('portal-password').value = '';
  }
}
async function loadMyAppointments(){
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'get_my_appointments', portalId:PORTAL_ID }) });
    if (res.ok) {
      var data = await res.json();
      _myAppointments = data.appointments || [];
      updateApptCancelButtons();
    }
  } catch(e) {}
}
function updateApptCancelButtons(){
  _portalPets.forEach(function(pet, pi){
    var area = document.getElementById('appt-cancel-area-'+pi);
    if (!area || !pet.nextApptDate) return;
    var match = _myAppointments.find(function(a){ return a.petName === pet.name && a.date === pet.nextApptDate; });
    if (match) {
      area.innerHTML = '<button type="button" onclick="cancelSelfServiceAppt('+pi+',\'' + match.id + '\')" style="background:none;border:1px solid var(--primary);color:var(--primary);border-radius:6px;padding:0.3rem 0.7rem;font-size:0.75rem;cursor:pointer;font-family:inherit;">Cancel This Appointment</button>';
    }
  });
}

      } else {

        }).join('');
      }
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      slotsEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">'+(errText || 'Could not check available times.')+'</div>';
    }
  } catch(e) {
    slotsEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">Could not check available times.</div>';
  }

async function bookSlot(pi, dateStr, startTime){
  var pet = _portalPets[pi];
  if (!pet) return;
  if (!confirm('Book '+pet.name+' for '+dateStr+' at '+startTime+'?')) return;
  var slotsEl = document.getElementById('booking-slots-'+pi);
  if (slotsEl) slotsEl.innerHTML = 'Booking…';
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'book_appointment', portalId:PORTAL_ID, petName:pet.name, date:dateStr, startTime:startTime }) });
    if (res.ok) {
      var data = await res.json();
      pet.nextApptDate = data.appointment.date;
      pet.nextApptTime = data.appointment.startTime;
      pet.nextApptReason = '';
      pet.nextApptId = data.appointment.id;
      _myAppointments.push(data.appointment);
      var block = document.getElementById('appt-block-'+pi);
      if (block) block.outerHTML = buildApptBlockHTML(pi, pet);
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      if (slotsEl) slotsEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">'+(errText || 'Could not book that time.')+'</div>';
    }
  } catch(e) {
    if (slotsEl) slotsEl.innerHTML = '<div style="color:#c0392b;font-size:0.85rem;">Could not book that time.</div>';
  }
}
async function cancelSelfServiceAppt(pi, appointmentId){
  var pet = _portalPets[pi];
  if (!pet) return;
  if (!confirm('Cancel this appointment? This frees the time slot for someone else.')) return;
  try {
    var res = await fetch(PET_PHOTO_WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'cancel_appointment', portalId:PORTAL_ID, appointmentId:appointmentId }) });
    if (res.ok) {
      pet.nextApptDate = '';
      pet.nextApptTime = '';
      pet.nextApptReason = '';
      pet.nextApptId = '';
      _myAppointments = _myAppointments.filter(function(a){ return a.id !== appointmentId; });
      var block = document.getElementById('appt-block-'+pi);
      if (block) block.outerHTML = buildApptBlockHTML(pi, pet);
    }
  } catch(e) {}
}
function requestApptChange(pi, kind){
  var pet = _portalPets[pi];
  var textEl = document.getElementById('message-compose');
  if (!pet || !textEl) return;
  var verb = kind === 'cancel' ? 'cancel' : 'reschedule';
  textEl.value = "I'd like to " + verb + " " + pet.name + "'s appointment on " + pet.nextApptDate + ". ";
  scrollToMessages();
  textEl.focus();
}
function icsEscapeText(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function addApptToCalendar(pi){
  var pet = _portalPets[pi];
  if (!pet || !pet.nextApptDate) return;
  var statusEl = document.getElementById('appt-calendar-status-'+pi);
  var startStr = pet.nextApptDate.replace(/-/g,'');
  var endDate = new Date(pet.nextApptDate + 'T00:00:00');
  endDate.setDate(endDate.getDate() + 1);
  var endStr = endDate.toISOString().slice(0,10).replace(/-/g,'');
  var stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  var summary = icsEscapeText(pet.name + "'s Grooming Appointment");
  var desc = icsEscapeText('Appointment at ' + (BUSINESS_NAME||'your groomer') + (pet.nextApptReason ? ' - ' + pet.nextApptReason : ''));
  var ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//' + icsEscapeText(BUSINESS_NAME||'Pet Portal') + '//EN\r\nBEGIN:VEVENT\r\nUID:' + Date.now() + '-' + pi + '@portal\r\nDTSTAMP:' + stamp + '\r\nDTSTART;VALUE=DATE:' + startStr + '\r\nDTEND;VALUE=DATE:' + endStr + '\r\nSUMMARY:' + summary + '\r\nDESCRIPTION:' + desc + '\r\nEND:VEVENT\r\nEND:VCALENDAR';
  var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = pet.name.replace(/[^a-z0-9]/gi,'-') + '-appointment.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (statusEl) {
    statusEl.style.display = 'block';
    statusEl.style.color = '#4a9d6e';
    statusEl.textContent = 'Downloaded! If it didn\'t open automatically, check your Downloads or notifications, then tap the file to add it to your calendar.';
  }
}
