<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Portal - Sign In</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f7f0ec;margin:0;color:#2b1e1a;}
.portal-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.portal-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:2.5rem;width:100%;max-width:400px;box-sizing:border-box;}
.portal-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;border-bottom:1px solid #eee;}
.portal-tab{flex:1;text-align:center;padding:0.6rem;font-size:0.85rem;font-weight:600;color:#9a8078;cursor:pointer;border-bottom:2px solid transparent;}
.portal-tab.active{color:#e0785a;border-bottom-color:#e0785a;}
.portal-panel{display:none;}
.portal-panel.active{display:block;}
.portal-field{margin-bottom:0.85rem;}
.portal-field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:0.3rem;}
.portal-field input{width:100%;padding:0.65rem 0.8rem;border:1.5px solid #dcded8;border-radius:7px;font-size:0.9rem;box-sizing:border-box;}
.portal-btn{width:100%;background:#e0785a;color:#fff;padding:0.75rem 1rem;border-radius:7px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;}
.pw-toggle-wrap{position:relative;}
.pw-toggle-wrap input{padding-right:2.5rem!important;}
.pw-toggle-btn{position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;padding:0.2rem;line-height:1;color:#9a8078;}
.portal-btn:disabled{opacity:0.6;cursor:not-allowed;}
.portal-error{font-size:0.8rem;color:#c0392b;margin-bottom:0.75rem;display:none;}
.portal-success{font-size:0.8rem;color:#4a9d6e;background:#eaf6f0;border:1px solid #4a9d6e;border-radius:6px;padding:0.75rem;margin-bottom:0.75rem;display:none;}
</style>
</head>
<body>
<div class="portal-wrap"><div class="portal-card">
  <div class="portal-tabs">
    <div class="portal-tab active" onclick="switchTab('login')">Sign In</div>
    <div class="portal-tab" onclick="switchTab('register')">Create Account</div>
  </div>
  <div class="portal-panel active" id="panel-login">
    <div class="portal-field"><label>Username</label><input type="text" id="login-user"/></div>
    <div class="portal-error" id="login-error"></div>
    <button class="portal-btn" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;font-size:0.78rem;color:#9a8078;margin-top:1rem;"><a href="#" onclick="toggleForgotPassword(true);return false;" style="color:#e0785a;">Forgot password?</a></p>
    <div id="forgot-password-box" style="display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid #eee;">
      <p style="font-size:0.8rem;color:#9a8078;margin-bottom:0.75rem;">Enter your username and we'll email you a reset code.</p>
      <div class="portal-field"><label>Username</label><input type="text" id="fp-user"/></div>
      <div class="portal-error" id="fp-status" style="color:#4a9d6e;"></div>
      <button class="portal-btn" onclick="requestReset()">Send Reset Code</button>
      <div id="fp-step2" style="display:none;margin-top:0.85rem;">
        <p style="font-size:0.8rem;color:#9a8078;margin-bottom:0.75rem;">Your code expires in 30 minutes.</p>
        <div class="portal-field"><label>Reset Code</label><input type="text" id="fp-code" placeholder="6-digit code from email"/></div>
        <div class="portal-field"><label>New Password <span style="font-weight:400;color:#9a8078;">(8-20 letters/numbers)</span></label><div class="pw-toggle-wrap"><input type="password" id="fp-newpass"/><button type="button" class="pw-toggle-btn" onclick="var f=document.getElementById('fp-newpass');f.type=f.type==='password'?'text':'password';" title="Click to show/hide">&#128065;</button></div></div>
        <div class="portal-field"><label>Confirm New Password</label><div class="pw-toggle-wrap"><input type="password" id="fp-newpass-confirm"/><button type="button" class="pw-toggle-btn" onclick="var f=document.getElementById('fp-newpass-confirm');f.type=f.type==='password'?'text':'password';" title="Click to show/hide">&#128065;</button></div></div>
        <button class="portal-btn" onclick="confirmReset()">Reset Password</button>
      </div>
      <p style="text-align:center;font-size:0.78rem;color:#9a8078;margin-top:0.75rem;"><a href="#" onclick="toggleForgotPassword(false);return false;" style="color:#e0785a;">Cancel</a></p>
    </div>
  </div>
  <div class="portal-panel" id="panel-register">
    <div class="portal-field"><label>Your Name</label><input type="text" id="reg-name"/></div>
    <div class="portal-field"><label>Email</label><input type="email" id="reg-email"/></div>
    <div class="portal-field"><label>Phone <span style="font-weight:400;color:#9a8078;">(optional)</span></label><input type="tel" id="reg-phone"/></div>
    <div class="portal-field"><label>Choose a Username</label><input type="text" id="reg-user"/></div>
    <div class="portal-field"><label>Choose a Password <span style="font-weight:400;color:#9a8078;">(8-20 letters/numbers)</span></label><div class="pw-toggle-wrap"><input type="password" id="reg-pass"/><button type="button" class="pw-toggle-btn" onclick="var f=document.getElementById('reg-pass');f.type=f.type==='password'?'text':'password';" title="Click to show/hide">&#128065;</button></div></div>
    <div class="portal-field"><label>Confirm Password</label><div class="pw-toggle-wrap"><input type="password" id="reg-pass-confirm"/><button type="button" class="pw-toggle-btn" onclick="var f=document.getElementById('reg-pass-confirm');f.type=f.type==='password'?'text':'password';" title="Click to show/hide">&#128065;</button></div></div>
    <div class="portal-error" id="register-error"></div>
    <div class="portal-success" id="register-success">Your account request was submitted! It can take a few minutes for everything to fully take effect.</div>
    <button class="portal-btn" onclick="submitRegistration()">Create Account</button>
  </div>
</div></div>
<script>
var WORKER_URL="https://groom-forms.stealthmail.workers.dev";
function switchTab(tab){
  document.querySelectorAll('.portal-tab').forEach(function(t,i){ t.classList.toggle('active', (tab==='login'?i===0:i===1)); });
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-register').classList.toggle('active', tab==='register');
}
function toggleForgotPassword(show){
  document.getElementById('forgot-password-box').style.display = show ? 'block' : 'none';
  document.getElementById('login-user').closest('.portal-panel').querySelectorAll('.portal-field,.portal-btn').forEach(function(el){
    if (!el.closest('#forgot-password-box')) el.style.display = show ? 'none' : '';
  });
}
async function requestReset(){
  var user = document.getElementById('fp-user').value.trim();
  var status = document.getElementById('fp-status');
  status.style.display = 'none';
  if (!user) { status.style.color='#c0392b'; status.textContent='Please enter your username.'; status.style.display='block'; return; }
  try {
    var res = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'reset_request', username:user})});
    if (res.ok) {
      status.style.color='#4a9d6e'; status.textContent='If that username exists, a reset code has been emailed to you. Enter it below.'; status.style.display='block';
      document.getElementById('fp-step2').style.display='block';
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      status.style.color='#c0392b'; status.textContent=errText||'Something went wrong. Please try again.'; status.style.display='block';
    }
  } catch(e) {
    status.style.color='#c0392b'; status.textContent='Something went wrong. Please try again.'; status.style.display='block';
  }
}
async function confirmReset(){
  var user = document.getElementById('fp-user').value.trim();
  var code = document.getElementById('fp-code').value.trim();
  var newPass = document.getElementById('fp-newpass').value;
  var newPassConfirm = document.getElementById('fp-newpass-confirm').value;
  var status = document.getElementById('fp-status');
  status.style.display = 'none';
  if (!code || !newPass || !newPassConfirm) { status.style.color='#c0392b'; status.textContent='Please enter the code and a new password.'; status.style.display='block'; return; }
  if (!/^[a-zA-Z0-9]{8,20}$/.test(newPass)) { status.style.color='#c0392b'; status.textContent='Password must be 8-20 letters/numbers.'; status.style.display='block'; return; }
  if (newPass !== newPassConfirm) { status.style.color='#c0392b'; status.textContent='Passwords do not match — please re-enter them.'; status.style.display='block'; return; }
  var btn = document.querySelector('#fp-step2 .portal-btn');
  if (btn) { btn.disabled=true; btn.textContent='Resetting…'; }
  try {
    var res = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'reset_confirm', username:user, code:code, newPassword:newPass})});
    if (res.ok) {
      document.getElementById('fp-code').value=''; document.getElementById('fp-newpass').value=''; document.getElementById('fp-newpass-confirm').value='';
      if (btn) { btn.disabled=false; btn.textContent='Reset Password'; }
      toggleForgotPassword(false);
      var loginMsg = document.getElementById('login-error');
      loginMsg.style.color='#4a9d6e'; loginMsg.textContent='Password reset! It can take a few minutes for the change to fully take effect. If signing in doesn’t work right away, please wait a bit and try again.'; loginMsg.style.display='block';
    } else {
      if (btn) { btn.disabled=false; btn.textContent='Reset Password'; }
      status.style.color='#c0392b'; status.textContent='That code is incorrect or has expired. Please request a new one.'; status.style.display='block';
    }
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='Reset Password'; }
    status.style.color='#c0392b'; status.textContent='Something went wrong. Please try again.'; status.style.display='block';
  }
}
async function doLogin(){
  var user = document.getElementById('login-user').value.trim();
  var err = document.getElementById('login-error');
  err.style.display='none';
  if (!user) { err.textContent='Please enter your username.'; err.style.display='block'; return; }
  if (!WORKER_URL) { err.textContent='Sign-in is not available yet - please contact us directly.'; err.style.display='block'; return; }
  var btn = document.querySelector('#panel-login .portal-btn');
  if (btn) btn.disabled = true;
  try {
    var res = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'lookup_username', username:user})});
    if (res.ok) {
      var data = await res.json();
      window.location.href = data.portalId + '.html';
      return;
    } else {
      err.textContent = 'Username not found. Please try again.';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Something went wrong. Please try again.';
    err.style.display = 'block';
  }
  if (btn) btn.disabled = false;
}
async function submitRegistration(){
  var name = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var phone = document.getElementById('reg-phone').value.trim();
  var user = document.getElementById('reg-user').value.trim();
  var pass = document.getElementById('reg-pass').value;
  var passConfirm = document.getElementById('reg-pass-confirm').value;
  var err = document.getElementById('register-error');
  err.style.display = 'none';
  if (!name || !email || !user || !pass || !passConfirm) { err.textContent='Please fill in all required fields.'; err.style.display='block'; return; }
  if (!/^[a-zA-Z0-9]{8,20}$/.test(pass)) { err.textContent='Password must be 8-20 letters/numbers.'; err.style.display='block'; return; }
  if (pass !== passConfirm) { err.textContent='Passwords do not match - please re-enter them.'; err.style.display='block'; return; }
  if (!WORKER_URL) { err.textContent='Account creation is not available yet - please contact us directly.'; err.style.display='block'; return; }
  var btn = document.querySelector('#panel-register .portal-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating account\u2026'; }
  try {
    var res = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'register', name:name, email:email, phone:phone, username:user, password:pass})});
    if (res.ok) {
      document.getElementById('register-success').style.display = 'block';
      ['reg-name','reg-email','reg-phone','reg-user','reg-pass','reg-pass-confirm'].forEach(function(id){ document.getElementById(id).value=''; });
    } else {
      var errText = await res.text().catch(function(){ return ''; });
      err.textContent = errText || 'Something went wrong submitting your request. Please try again.';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Something went wrong. Please try again.';
    err.style.display = 'block';
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Create Account'; }
}
document.getElementById('login-user').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
